name: tieba-monitor
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install aiotieba requests
      - run: python tieba_monitor.py
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add seen.json
          git commit -m "update seen" || true
          git push
